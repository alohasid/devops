replicaCount: 1

image:
  repository: "123456789012.dkr.ecr.us-west-2.amazonaws.com/lesson-5-ecr"
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

configMap:
  POSTGRES_DB: "devops_db"
  POSTGRES_USER: "devops_user"
  POSTGRES_HOST: "lesson-db-module.c12345678901.us-west-2.rds.amazonaws.com"
  POSTGRES_PORT: "5432"

secret:
  secretKey: "placeholder-will-be-overridden-by-argo"
  postgresPassword: "placeholder-will-be-overridden-by-argo"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80