apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.prometheusRepoUrl }}
    chart: kube-prometheus-stack
    targetRevision: {{ .Values.prometheusChartVersion }}
    helm:
      parameters:
        - name: "grafana.service.type"
          value: "LoadBalancer"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true